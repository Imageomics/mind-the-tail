# ResNet-50 (ImageNet-pretrained) on the top-10% class-balanced waterbirds subset.
# Other budgets: --set ratio=0.3 output_dir=...
selection_dir: ${OUTPUT_ROOT}/selection/waterbirds
ratio: 0.1
dataset:
  name: waterbirds
  root: ${DATA_ROOT}/waterbirds
  split: val
output_dir: ${OUTPUT_ROOT}/downstream/waterbirds_10pct
arch: resnet50
pretrained: true
max_steps: 18700
batch_size: 128
eval_batch_size: 256
lr: 0.001
momentum: 0.9
weight_decay: 0.0001
scheduler: none
eval_every_steps: 800
num_workers: 24
seed: 0
