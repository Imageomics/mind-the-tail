# Within-class ranking of the imagenet1k training pool (beta=2.0, k=3, hnsw neighbors).
image_activations: ${OUTPUT_ROOT}/image_activations/imagenet1k
output_dir: ${OUTPUT_ROOT}/selection/imagenet1k
mode: within_class
beta: 2.0
k: 3
neighbors: hnsw
hnsw:
  projection_dim: 512
  candidates: 50
  m: 32
  ef_construction: 200
  ef_search: 100
  threads: 8
  seed: 0
